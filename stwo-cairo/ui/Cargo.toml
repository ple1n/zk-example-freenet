[package]
name = "stwo-cairo-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
freenet-stdlib = { version = "0.12.1", features = ["net"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "File",
    "FileList",
    "HtmlInputElement",
    "WebSocket",
    "Window",
] }

[workspace]
