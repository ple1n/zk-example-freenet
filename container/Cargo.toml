[package]
name = "container"
version = "0.1.0"
edition = "2024"

[dependencies]
freenet-stdlib = "0.12.1"
zk-notepad-shared = { path = "../shared", features = ["hash"] }
zkm-verifier.workspace = true
bincode.workspace = true
hex.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib"]

[features]
contract = ["freenet-stdlib/contract"]
default = ["freenet-main-contract", "contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]
