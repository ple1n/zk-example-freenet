[workspace]
members = ["client", "container", "guest"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
freenet-stdlib = "0.12.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
sp1-build = "6.0.0"
sp1-sdk = "6.0.0"
sp1-verifier = { version = "6.0.0", default-features = false, features = ["full"] }
sp1-zkvm = "6.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zk-notepad-shared = { path = "../shared" }
