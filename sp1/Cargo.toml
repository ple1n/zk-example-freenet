[workspace]
members = [
    "client",
    "container",
    "guest",
    "host-common",
    "merkle-client",
    "merkle-container",
    "merkle-guest",
    "merkle-shared",
    "ui",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
freenet-stdlib = "0.12.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp1-build = "6.0.0"
sp1-prover = "6.0.0"
sp1-primitives = "6.0.0"
sp1-sdk = "6.0.0"
sp1-verifier = { version = "6.0.0", default-features = false, features = ["full"] }
sp1-zkvm = "6.0.0"
slop-algebra = "6.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.27"
zk-notepad-shared = { path = "../shared", default-features = false }
sp1-host-common = { path = "host-common" }
sp1-merkle-shared = { path = "merkle-shared" }
