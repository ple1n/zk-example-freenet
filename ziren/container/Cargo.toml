[package]
name = "container"
version = "0.1.0"
edition = "2024"

[dependencies]
freenet-stdlib = "0.12.1"
zk-notepad-shared = { path = "../../shared", default-features = false, features = ["hash"] }
zkm-verifier = { git = "https://github.com/ProjectZKM/Ziren", rev = "0e2d38388e580f3e061e9bb13d4173d6a614b6a6" }
bincode = "1.3.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib"]

[features]
contract = ["freenet-stdlib/contract"]
default = ["freenet-main-contract", "contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]
