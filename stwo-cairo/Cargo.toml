[workspace]
members = ["contract", "protocol", "prover", "verifier"]
exclude = ["ui"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
bincode = "1.3"
bzip2 = { version = "0.5.0", default-features = false, features = ["libbz2-rs-sys"] }
cairo-lang-executable = "=2.19.0"
cairo-lang-execute-utils = "=2.19.0"
cairo-lang-runner = "=2.19.0"
cairo-air = "1.3.0"
cairo-program-runner-lib = "1.3.1"
cairo-vm = "3.2.0"
clap = { version = "4", features = ["derive"] }
freenet-stdlib = "0.12.1"
hex = "0.4"
num-bigint = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
stwo-cairo-adapter = "1.3.0"
stwo-cairo-prover = { version = "1.3.0", features = ["nightly"] }
stwo-cairo-protocol = { path = "protocol" }
stwo-cairo-verifier = { path = "verifier" }
stwo = "2.3.0"
zk-notepad-shared = { path = "../shared", default-features = false, features = ["progress"] }
