[package]
name = "notepad-client"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
bincode = "1.3.3"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = "1"
zk-notepad-shared = { path = "../../shared", features = ["hash"] }
zkm-sdk = { git = "https://github.com/ProjectZKM/Ziren", rev = "0e2d38388e580f3e061e9bb13d4173d6a614b6a6" }
zkm-verifier = { git = "https://github.com/ProjectZKM/Ziren", rev = "0e2d38388e580f3e061e9bb13d4173d6a614b6a6" }
freenet-stdlib = { version = "0.12.1", features = ["net"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.27"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
zkm-build = { git = "https://github.com/ProjectZKM/Ziren", rev = "0e2d38388e580f3e061e9bb13d4173d6a614b6a6" }
