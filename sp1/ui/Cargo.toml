[package]
name = "sp1-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode.workspace = true
dioxus = { version = "0.7.10", features = ["web"] }
freenet-stdlib = { workspace = true, features = ["net"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "File",
    "FileList",
    "HtmlInputElement",
    "Location",
    "WebSocket",
    "Window",
] }
