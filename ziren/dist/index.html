<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziren Authenticated Notepad</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151b; color: #e8edf2; }
      body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; }
      h1 { margin-bottom: .25rem; }
      p, label { color: #b8c2cc; }
      form { display: grid; gap: 1rem; margin-top: 2rem; }
      label { display: grid; gap: .4rem; }
      input, textarea, button { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #394550; border-radius: .45rem; background: #18212a; color: inherit; }
      textarea { min-height: 7rem; font: 13px/1.4 ui-monospace, monospace; }
      button { background: #286cce; border: 0; font-weight: 650; cursor: pointer; }
      button:hover { background: #347fe8; }
      output, pre { display: block; padding: .75rem; border-radius: .45rem; background: #18212a; white-space: pre-wrap; overflow-wrap: anywhere; }
      .hint { font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ziren-authenticated notepad</h1>
      <p>A native Rust client creates the proof. This page submits its text, counter, and proof to a Freenet contract for verification.</p>
      <form id="submit-form">
        <label>
          Contract instance ID
          <input id="contract-id" required autocomplete="off" placeholder="Base58 contract instance ID" />
        </label>
        <label>
          Load prover candidate JSON
          <input id="candidate-file" type="file" accept="application/json,.json" />
        </label>
        <label>
          Counter
          <input id="counter" type="number" min="0" step="1" required />
        </label>
        <label>
          Text
          <textarea id="text" required></textarea>
        </label>
        <label>
          Compressed Ziren STARK proof (hex)
          <textarea id="proof" required spellcheck="false"></textarea>
        </label>
        <button type="submit">Submit attempted update</button>
      </form>
      <h2>Status</h2>
      <output id="status">Ready. Connect through the Freenet node hosting this webapp.</output>
      <h2>Current note</h2>
      <pre id="current-note">Not loaded.</pre>
    </main>
    <script src="bundle.js"></script>
  </body>
</html>
